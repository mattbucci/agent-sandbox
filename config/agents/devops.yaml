agent:
  type: devops
  name: "DevOps Engineer"

vm:
  vcpus: 4
  mem_mb: 8192

egress:
  presets: [github, google, hashicorp, kubernetes, docker-hub, cloud-providers]

github:
  repos: []  # set to ["myorg/myrepo"] to scope token
  permissions: [contents:read, actions:write, deployments:write, environments:read]

capabilities:
  presets: [github-cli, kubernetes, docker]
  packages:
    apt: [ansible]
  install_scripts: [terraform.sh, kubectl.sh, helm.sh]

tools:
  - name: gh
    description: "Manage GitHub releases, review deployment PRs, and coordinate release branches"
  - name: terraform
    description: "Plan and apply infrastructure changes with state locking and drift detection"
  - name: kubectl
    description: "Inspect and manage Kubernetes cluster resources, rollouts, and pod health"
  - name: helm
    description: "Install, upgrade, and rollback Helm chart releases across environments"
  - name: ansible
    description: "Run playbooks for configuration management and ad-hoc host operations"
  - name: docker
    description: "Build, tag, and push container images to registries"
  - name: git
    from: base
  - name: chromium
    from: base
  - name: agent-browser
    from: base

prompt:
  role: |
    You are a DevOps engineer responsible for shipping features to production, managing infrastructure as code, and maintaining deployment pipelines. You treat every infrastructure change as a code change: Terraform plans are reviewed before apply, Helm values are version-controlled, and rollbacks are always one command away. You manage feature flags to decouple deployment from release, enabling safe progressive rollouts and instant kill switches when incidents arise. Your operational instinct is to automate first, document second, and never perform a manual step that could be scripted. When something goes wrong in production, you triage quickly, roll back decisively, and write up the incident timeline afterward.
  presets: [explore-tools, git-workflow, code-execution, browser-instructions, report-output]
  sections:
    deployment-workflow: |
      Follow this deployment sequence for every change:
      1. Run `terraform plan` and review the diff for unintended resource changes.
      2. Apply infrastructure changes to staging first; verify health checks pass.
      3. Build and push the container image with a commit-sha tag, never "latest".
      4. Use `helm upgrade --atomic` so failed deploys auto-rollback.
      5. After deploy, monitor pod readiness and run smoke tests via kubectl.
      6. If rollback is needed, use `helm rollback` to the previous revision immediately.
      7. Update the feature flag configuration to control traffic exposure.
      8. Record the deployment in the GitHub release and tag the commit.
    output_dir: reports

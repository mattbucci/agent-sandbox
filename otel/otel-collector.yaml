# =============================================================================
# OpenTelemetry Collector configuration for Agent Sandbox
#
# Receives traces from agent VMs via OTLP/HTTP on port 4318
# Scrapes gateway metrics from 127.0.0.1:8642/metrics
# Exports to local file + optionally to a remote backend
# =============================================================================

receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"
      grpc:
        endpoint: "0.0.0.0:4317"

  # Scrape the gateway's Prometheus endpoint. No auth needed: the gateway
  # allows unauthenticated /metrics from loopback addresses.
  prometheus:
    config:
      scrape_configs:
        - job_name: hermes-gateway
          scrape_interval: 30s
          metrics_path: /metrics
          static_configs:
            - targets: ["127.0.0.1:8642"]

  # Uncomment to also collect host CPU/memory/disk/network metrics.
  # hostmetrics:
  #   collection_interval: 60s
  #   scrapers:
  #     cpu:
  #     memory:
  #     disk:
  #     network:
  #     filesystem:

processors:
  batch:
    timeout: 5s
    send_batch_size: 256

  # Add resource attributes for easier filtering
  resource:
    attributes:
      - key: deployment.environment
        value: "agent-sandbox"
        action: upsert

exporters:
  # Log traces to file for local debugging
  file/traces:
    path: /var/log/otel/traces.jsonl
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 3

  # Archive metrics to file (offline grep; the dashboard reads live gateway state)
  file/metrics:
    path: /var/log/otel/metrics.jsonl
    rotation:
      max_megabytes: 50
      max_days: 7
      max_backups: 3

  # Console output (useful for initial debugging, disable in production)
  debug:
    verbosity: basic

  # Uncomment to forward to a remote backend (Jaeger, Grafana Tempo, etc.)
  # otlphttp/jaeger:
  #   endpoint: "http://jaeger:4318"
  # otlphttp/tempo:
  #   endpoint: "http://tempo:4318"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [file/traces, debug]

    metrics:
      receivers: [otlp, prometheus]
      processors: [resource, batch]
      exporters: [file/metrics]

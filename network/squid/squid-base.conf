# =============================================================================
# Squid Configuration — Agent Sandbox
#
# Transparent HTTPS proxy with peek-and-splice (SNI-based domain filtering).
# Does NOT decrypt traffic — only inspects the SNI field in the TLS ClientHello
# to determine the destination domain, then either splices (allows) or
# terminates (blocks) the connection.
#
# Per-VM ACLs are generated by gen-acl.sh and loaded from /etc/squid/acls/
# =============================================================================

# --- Ports ---
# Regular HTTP port (needed for Squid internals / cache manager)
http_port 3130

# HTTP transparent intercept
http_port 3128 intercept

# HTTPS transparent intercept with SSL bump (peek-and-splice)
https_port 3129 intercept ssl-bump \
    cert=/etc/squid/ssl/squid-ca-combined.pem \
    generate-host-certificates=off \
    dynamic_cert_mem_cache_size=16MB

# SSL certificate generator helper
sslcrtd_program /usr/lib64/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 64MB
sslcrtd_children 5 startup=1 idle=1

# --- Access Control ACLs (must be defined before use) ---
acl SSL_ports port 443
acl Safe_ports port 80 443 1025-65535
acl CONNECT method CONNECT

# Combined allowed domains list (union of all per-VM allowlists)
acl all_allowed_domains ssl::server_name "/etc/squid/acls/all-allowed-domains.txt"
acl all_allowed_http_domains dstdomain "/etc/squid/acls/all-allowed-domains.txt"

# --- SSL Bump Configuration ---
# Step 1: Peek at the ClientHello to read SNI
acl step1 at_step SslBump1
ssl_bump peek step1

# Step 2: Splice (pass through) if domain is allowed, terminate otherwise
ssl_bump splice all_allowed_domains
ssl_bump terminate all

# --- HTTP Access Rules ---
http_access deny CONNECT !SSL_ports
http_access deny !Safe_ports

# Per-VM ACLs (generated dynamically by gen-acl.sh)
# Each file defines: acl vmN_src, acl vmN_domains, http_access allow rules
# Note: include requires at least one matching file, so we use a placeholder
include /etc/squid/acls/vm-acls.conf

# Allow HTTP to allowed domains (for non-CONNECT traffic)
http_access allow all_allowed_http_domains

# Default: deny everything
http_access deny all

# --- Logging ---
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# --- Performance ---
maximum_object_size 0
cache deny all
memory_pools off

# --- Misc ---
visible_hostname agent-sandbox-proxy
forwarded_for delete
via off

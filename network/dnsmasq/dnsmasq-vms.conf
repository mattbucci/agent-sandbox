# =============================================================================
# dnsmasq configuration for Agent Sandbox VMs
#
# Provides DNS resolution for all VM subnets (10.0.X.1).
# Listens on the host side of each TAP device.
# =============================================================================

# Don't read /etc/resolv.conf (we specify our own upstream)
no-resolv

# Upstream DNS servers
server=1.1.1.1
server=8.8.8.8
server=1.0.0.1

# Listen on all 10.0.X.1 addresses (added dynamically by TAP setup)
# Also listen on localhost for host queries
listen-address=127.0.0.1

# Bind only to specified interfaces (safer)
bind-dynamic

# Don't forward queries without a domain part
domain-needed

# Don't forward reverse lookups for private ranges
bogus-priv

# Cache size
cache-size=1000

# Log queries (useful for debugging, disable in production)
# log-queries
# log-facility=/var/log/dnsmasq-vms.log

# PID file
pid-file=/run/dnsmasq-vms.pid
